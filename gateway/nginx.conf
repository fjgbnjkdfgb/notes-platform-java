worker_processes 1;

events
{
    worker_connections 1024;
}

http
{
    include /etc/nginx/mime.types;

    upstream users  { server users:8080; }
    upstream tags   { server tags:8080; }
    upstream notes  { server notes:8080; }
    upstream search { server search:8080; }

    server
    {
        listen 80;

        location = /
        {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /users/
        {
            proxy_pass http://users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /tags/
        {
            proxy_pass http://tags/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /notes/
        {
            proxy_pass http://notes/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /search/
        {
            proxy_pass http://search/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
